{% extends 'base.html' %}{% block content %}
<div class="heading"><div><p class="eyebrow">APPLICATION DETAILS</p><h1>{{ heading }}</h1><p class="muted">Keep your information up to date.</p></div><a class="button subtle" href="{{ url_for('index') }}">← Dashboard</a></div>
<form method="post" class="panel form-panel"><div class="form-grid"><label>Company *<input name="company" maxlength="120" required value="{{ application.get('company', '') }}" placeholder="e.g. Shopify"></label><label>Position *<input name="position" maxlength="160" required value="{{ application.get('position', '') }}" placeholder="e.g. Software Developer Intern"></label><label>Location<input name="location" maxlength="160" value="{{ application.get('location', '') }}" placeholder="e.g. Toronto, ON / Remote"></label><label>Status<select name="status">{% for status in statuses %}<option value="{{ status }}" {% if application.get('status', 'Applied') == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>Application date *<input name="applied_date" type="date" required value="{{ application.get('applied_date', today) }}"></label><label>Job posting URL<input name="job_url" type="url" maxlength="2000" value="{{ application.get('job_url', '') }}" placeholder="https://..."></label><label class="full">Notes<textarea name="notes" rows="5" placeholder="Recruiter contact, interview notes, next steps...">{{ application.get('notes', '') }}</textarea></label></div><div class="form-actions"><button class="button primary" type="submit">Save application</button><a class="button subtle" href="{{ url_for('index') }}">Cancel</a></div></form>
{% endblock %}
